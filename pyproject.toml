[project]
name = "ha-hnap-device"
version = "1.2.1"
description ="HomeAssistant integration for HNAP devices"
readme = "README.md"
requires-python = ">=3.13.2"
authors = [
  {name = "Luis López", email = "luis@cuarentaydos.com"},
]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ldotlopez/ha-hnap-device"
Issues = "https://github.com/ldotlopez/ha-hnap-device/issues"
Repository = "https://github.com/ldotlopez/ha-hnap-device.git"

[dependency-groups]
dev = [
    # "black>=24.10.0",
    "homeassistant==2026.2.0",
    # "ipdb>=0.13.13",
    # "ipython>=8.31.0",
    # "isort>=6.0.0b2",
    # "mypy>=1.14.1",
    "pre-commit>=4.0.1",
    # "pyupgrade>=3.19.1",
    # "requests>=2.32.3",
    "types-requests>=2.31.0.6",
]

[tool.black]
target-version = ['py313']

[tool.isort]
profile = "black"

[tool.pyupgrade]
addopts = "--py313-plus"
