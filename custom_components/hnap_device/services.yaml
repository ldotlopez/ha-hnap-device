# Service ID
call:

  # Service name as shown in UI
  name: Call HNAP method

  # Description of the service
  description: >
    Call an HNAP method and optionally return its response. When targeting
    multiple devices, `results` contains one response per matching device.

  # Restrict targeting to entities provided by this integration.
  target:
    entity:
      integration: hnap_device

  # Different fields that your service accepts
  fields:

    # Key of the field
    method:

      # Field name as shown in UI
      name: Method

      # Description of the field
      description: Method to call

      # Whether or not field is required (default = false)
      required: true

      # Advanced fields are only shown when the advanced mode is enabled for
      # the user (default = false)
      advanced: false

      # Example value that can be passed for this field
      example: "GetDeviceSettings"

      # The default field value
      default: "GetDeviceSettings"

      # Selector (https://www.home-assistant.io/docs/blueprint/selectors/) to
      # control the input UI for this field
      selector:
        text:

    parameters:
      name: Parameters
      description:
        Parameters for the method, method specific
      required: false
      advanced: false
      selector:
        object:
